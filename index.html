<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1116" media="(prefers-color-scheme: dark)">
<meta name="description" content="Powcast: daily snowfall for 32 Colorado resorts and passes. Past 10 days and next 15, multi-model comparisons, and a 3D snowfall map. Model, station, and official data stay labeled.">
<title>Powcast | Colorado snowfall</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d5fae'/%3E%3Cpath d='m5 24 8-14 5 8 3-5 6 11Z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try { const t = JSON.parse(localStorage.getItem('powcast-v3') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<script type="module" src="app.js"></script>
</head>
<body>
<a href="#main" class="skip">Skip to content</a>

<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2m0 15v2M2.5 12h2m15 0h2M5.3 5.3l1.4 1.4m10.6 10.6 1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/" aria-label="Powcast, all locations">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="m5 24 8-14 5 8 3-5 6 11Z"/></svg>
      <span translate="no">Powcast</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-route="home">Snowfall</a>
      <a href="#/map" data-route="map">3D map</a>
      <a href="#/about" data-route="about">Methods</a>
    </nav>
    <div class="top-actions">
      <div class="segmented" role="group" aria-label="Units">
        <button type="button" data-units="imperial" aria-pressed="true">in</button>
        <button type="button" data-units="metric" aria-pressed="false">cm</button>
      </div>
      <button type="button" class="icon-btn" id="themeButton" aria-label="Switch theme"><svg class="icon"><use href="#i-moon"/></svg></button>
    </div>
  </div>
</header>
<main id="main" tabindex="-1">
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <section id="view-home" class="view" aria-labelledby="homeTitle" hidden></section>
  <section id="view-resort" class="view" hidden></section>
  <section id="view-map" class="view view-map" aria-labelledby="mapTitle" hidden></section>
  <section id="view-about" class="view prose-view" aria-labelledby="aboutTitle" hidden></section>
</main>
<footer class="footer">
  <div class="footer-inner">
    <p><strong translate="no">Powcast</strong> is an independent viewing tool. Not affiliated with OpenSnow or any resort. Forecasts are model output; always check official sources.</p>
    <p class="links">
      <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Weather data by Open-Meteo</a>
      <a href="https://www.nrcs.usda.gov/resources/data-and-reports/snow-and-water-interactive-map" target="_blank" rel="noopener noreferrer">NRCS SNOTEL</a>
      <a href="https://avalanche.state.co.us/" target="_blank" rel="noopener noreferrer">CAIC avalanche forecasts</a>
      <a href="https://www.cotrip.org/" target="_blank" rel="noopener noreferrer">Colorado road conditions (COTrip)</a>
    </p>
  </div>
</footer>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><p class="noscript">Powcast needs JavaScript to load forecasts. Official sources are linked in the footer.</p></noscript>
</body>
</html>
