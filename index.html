<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Powcast — Colorado Snow Forecast</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0a0d12;
    --panel: #12161d;
    --panel2: #171c25;
    --line: #232a36;
    --line2: #2c3542;
    --text: #e8edf3;
    --muted: #8a95a4;
    --dim: #5c6774;
    --accent: #4cc2ff;
    --accent-soft: rgba(76, 194, 255, 0.12);
    --good: #3ddc97;
    --warn: #ffb454;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--dim); }

  .topbar {
    height: 56px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; position: relative; z-index: 1200;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(76,194,255,.6);
  }
  .brand h1 { font-size: 16px; font-weight: 700; letter-spacing: .3px; margin: 0; }
  .brand span { color: var(--muted); font-weight: 500; }
  .top-right { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--muted); }
  .live { display: flex; align-items: center; gap: 6px; color: var(--good); font-weight: 600; font-size: 11px; letter-spacing: .5px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  #map { position: fixed; top: 56px; bottom: 0; left: 0; right: 0; z-index: 1; background: var(--bg); }
  .leaflet-container { background: var(--bg); font-family: inherit; }
  .leaflet-popup-content-wrapper { background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .leaflet-popup-tip { background: var(--panel); border: 1px solid var(--line2); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 12px; line-height: 1.5; }
  .leaflet-popup-close-button { color: var(--muted) !important; }
  .leaflet-bar a { background: var(--panel); color: var(--text); border-bottom: 1px solid var(--line); }
  .leaflet-bar a:hover { background: var(--panel2); }
  .leaflet-control-attribution { background: rgba(10,13,18,.8); color: var(--dim); font-size: 10px; }
  .leaflet-control-attribution a { color: var(--dim); }

  .resort-marker {
    background: #1a2430; border: 1.5px solid #4cc2ff; color: #e8edf3;
    border-radius: 16px; padding: 3px 9px; font-size: 11px; font-weight: 700;
    white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.5);
    display: flex; align-items: center; gap: 4px; cursor: pointer;
    transform: translate(-50%, -50%); transition: transform .12s ease, background .12s ease;
  }
  .resort-marker:hover { transform: translate(-50%,-50%) scale(1.08); background: #243341; z-index: 1000; }
  .resort-marker.selected { background: #4cc2ff; color: #04121c; border-color: #fff; }
  .resort-marker .val { font-variant-numeric: tabular-nums; }
  .resort-marker.big { border-color: #ffd166; }
  .resort-marker.big.selected { background: #ffd166; }

  .panel {
    position: fixed; top: 56px; left: 0; bottom: 0; width: 396px;
    background: var(--panel); border-right: 1px solid var(--line);
    z-index: 1100; overflow-y: auto; overflow-x: hidden;
    box-shadow: 4px 0 24px rgba(0,0,0,.35);
  }
  @media (max-width: 860px) {
    .panel { width: 100%; max-width: 396px; left: auto; right: 0; border-right: none; border-left: 1px solid var(--line); }
  }
  .panel-inner { padding: 18px 18px 28px; }

  .panel-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .panel-head h2 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -.3px; }
  .region { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .elev { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .elev b { color: var(--text); font-weight: 600; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
  .stat {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  }
  .stat .label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .stat .val { font-size: 26px; font-weight: 800; margin-top: 5px; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .stat .val small { font-size: 13px; font-weight: 600; color: var(--muted); }
  .stat .sub { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .stat.accent { background: var(--accent-soft); border-color: rgba(76,194,255,.3); }
  .stat.accent .val { color: var(--accent); }
  .obs-tag { font-size: 9px; background: rgba(61,220,151,.15); color: var(--good); border: 1px solid rgba(61,220,151,.3); padding: 1px 5px; border-radius: 4px; font-weight: 700; letter-spacing: .4px; }
  .fc-tag { font-size: 9px; background: rgba(76,194,255,.12); color: var(--accent); border: 1px solid rgba(76,194,255,.3); padding: 1px 5px; border-radius: 4px; font-weight: 700; letter-spacing: .4px; }

  .sec-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
  .sec-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .day-card {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px; transition: border-color .15s ease;
  }
  .day-card:hover { border-color: var(--line2); }
  .day-top { display: flex; justify-content: space-between; align-items: center; }
  .day-top .d { font-weight: 700; font-size: 14px; }
  .day-top .d small { color: var(--muted); font-weight: 500; margin-left: 6px; }
  .wx-icon { width: 22px; height: 22px; }
  .snow-pill { font-weight: 800; font-size: 16px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .snow-pill.none { color: var(--dim); font-weight: 600; }
  .day-meta { display: flex; gap: 14px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  .day-meta b { color: var(--text); font-weight: 600; }
  .wind-flag { margin-top: 8px; font-size: 11px; color: var(--warn); display: flex; align-items: center; gap: 5px; font-weight: 600; }
  .conf { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
  .conf .bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .conf .bar i { display: block; height: 100%; border-radius: 2px; }
  .conf span { font-size: 10px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }

  .chart-wrap { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .chart-svg { width: 100%; height: 190px; display: block; }
  .chart-legend { display: flex; gap: 16px; font-size: 11px; color: var(--muted); margin-top: 8px; }
  .chart-legend .k { display: flex; align-items: center; gap: 5px; }
  .chart-legend .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  tr:hover td { background: var(--panel2); }
  td.s { color: var(--accent); font-weight: 700; }
  td.t { font-weight: 600; }

  .src-note { font-size: 10.5px; color: var(--dim); line-height: 1.5; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .src-note b { color: var(--muted); }

  .map-toggle {
    position: fixed; top: 68px; right: 14px; z-index: 1150;
    background: var(--panel); border: 1px solid var(--line2); border-radius: 8px;
    color: var(--text); font-size: 11.5px; font-weight: 600; padding: 7px 12px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.4);
  }
  .map-toggle:hover { background: var(--panel2); }
  .map-toggle .ind { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .map-toggle.on .ind { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  .skel { background: linear-gradient(90deg, var(--panel2) 25%, var(--line) 50%, var(--panel2) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 8px; }
  @keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  footer { padding: 14px 20px; font-size: 10.5px; color: var(--dim); border-top: 1px solid var(--line); line-height: 1.6; background: var(--panel); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="dot"></div>
    <h1>POWCAST <span>· Colorado</span></h1>
  </div>
  <div class="top-right">
    <div class="live"><i></i>LIVE</div>
    <div id="clock">—</div>
    <div>20 resorts</div>
  </div>
</header>

<div id="map"></div>
<button id="radarBtn" class="map-toggle"><span class="ind"></span>Precip radar</button>

<aside class="panel">
  <div class="panel-inner" id="panelContent"></div>
</aside>

<script>
/* ============================ CONFIG ============================ */
const REFRESH_MS = 10 * 60 * 1000;
const HIST_DAYS = 7, FC_DAYS = 14;

const RESORTS = [
  {name:'Vail',lat:39.6403,lon:-106.3742,elev:12408,region:'Central',snotel:'842:CO:SNTL'},
  {name:'Beaver Creek',lat:39.6042,lon:-106.5165,elev:11440,region:'Central',snotel:'1041:CO:SNTL'},
  {name:'Breckenridge',lat:39.4817,lon:-106.0384,elev:12998,region:'Central',snotel:'415:CO:SNTL'},
  {name:'Keystone',lat:39.6069,lon:-105.9439,elev:12408,region:'Central',snotel:'505:CO:SNTL'},
  {name:'Copper Mountain',lat:39.5022,lon:-106.1511,elev:12313,region:'Central',snotel:'415:CO:SNTL'},
  {name:'Arapahoe Basin',lat:39.6425,lon:-105.8717,elev:13050,region:'Central',snotel:'505:CO:SNTL'},
  {name:'Winter Park',lat:39.8868,lon:-105.7625,elev:12060,region:'Front Range',snotel:'1186:CO:SNTL'},
  {name:'Steamboat',lat:40.4572,lon:-106.8045,elev:10568,region:'Northern',snotel:'457:CO:SNTL'},
  {name:'Aspen Snowmass',lat:39.2084,lon:-106.9490,elev:12510,region:'Western',snotel:'669:CO:SNTL'},
  {name:'Telluride',lat:37.9375,lon:-107.8123,elev:13150,region:'Southern',snotel:'1344:CO:SNTL'},
  {name:'Crested Butte',lat:38.8991,lon:-106.9659,elev:12162,region:'Western',snotel:'380:CO:SNTL'},
  {name:'Loveland',lat:39.6800,lon:-105.8979,elev:13010,region:'Central',snotel:'602:CO:SNTL'},
  {name:'Eldora',lat:39.9372,lon:-105.5827,elev:10600,region:'Front Range',snotel:'564:CO:SNTL'},
  {name:'Monarch Mountain',lat:38.5122,lon:-106.3320,elev:11961,region:'Central',snotel:'701:CO:SNTL'},
  {name:'Purgatory',lat:37.6303,lon:-107.8140,elev:10822,region:'Southern',snotel:'387:CO:SNTL'},
  {name:'Wolf Creek',lat:37.4722,lon:-106.7930,elev:11904,region:'Southern',snotel:'874:CO:SNTL'},
  {name:'Silverton Mountain',lat:37.8846,lon:-107.6659,elev:13487,region:'Southern',snotel:'713:CO:SNTL'},
  {name:'Powderhorn',lat:39.0694,lon:-108.1507,elev:9850,region:'Western',snotel:'622:CO:SNTL'},
  {name:'Sunlight Mountain',lat:39.3998,lon:-107.3387,elev:9895,region:'Western',snotel:'618:CO:SNTL'},
  {name:'Ski Cooper',lat:39.3603,lon:-106.3014,elev:11700,region:'Central',snotel:'485:CO:SNTL'},
];

const state = { map:null, radar:null, radarOn:false, markers:{}, selected:null, data:{}, snotelMeta:{} };

/* ============================ ICONS (inline SVG, no emoji) ============================ */
const IC = {
  snow:'<svg class="wx-icon" viewBox="0 0 24 24" fill="none" stroke="#4cc2ff" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v20M4 6l16 12M20 6L4 18M12 2l-2 3m2-3 2 3M12 22l-2-3m2 3 2-3M4 6l3.5.5M4 6 5 9.5M20 18l-3.5-.5m3.5.5-1-3.5M20 6l-1 3.5M20 6l-3.5.5M4 18l1-3.5M4 18l3.5.5"/></svg>',
  sun:'<svg class="wx-icon" viewBox="0 0 24 24" fill="none" stroke="#ffd166" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  cloud:'<svg class="wx-icon" viewBox="0 0 24 24" fill="none" stroke="#9aa7b5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 18a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.5 1.5A4 4 0 0 0 6.5 18h11z"/></svg>',
  part:'<svg class="wx-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="9" r="3.5" stroke="#ffd166"/><path d="M9 2v1.5M9 14.5V16M2 9h1.5M14.5 9H16M4 4l1 1M13 13l1 1" stroke="#ffd166"/><path d="M17 19a3.5 3.5 0 0 0 0-7 4.5 4.5 0 0 0-4.3 3.1A3 3 0 0 0 13 19h4z" stroke="#9aa7b5"/></svg>',
  rain:'<svg class="wx-icon" viewBox="0 0 24 24" fill="none" stroke="#5aa9e6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 13a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.5 1.5A4 4 0 0 0 6.5 13h11z"/><path d="M8 17v3M12 16v4M16 17v3"/></svg>',
  storm:'<svg class="wx-icon" viewBox="0 0 24 24" fill="none" stroke="#c792ea" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 11a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.5 1.5A4 4 0 0 0 6.5 11h11z"/><path d="M13 12l-3 5h4l-3 5"/></svg>',
  wind:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9.6 4.6A2 2 0 1 1 11 8H2M12.6 19.4A2 2 0 1 0 14 16H2M17.7 7.7A2.5 2.5 0 1 1 19.5 12H2"/></svg>',
  alert:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
};

function wxIcon(code) {
  if ([71,73,75,77,85,86].includes(code)) return IC.snow;
  if ([51,53,55,61,63,65,80,81,82,56,57,66,67].includes(code)) return IC.rain;
  if ([95,96,99].includes(code)) return IC.storm;
  if (code === 0) return IC.sun;
  if ([1,2].includes(code)) return IC.part;
  return IC.cloud;
}

/* ============================ HELPERS ============================ */
const $ = id => document.getElementById(id);
const r1 = v => Math.round(v * 10) / 10;
const r0 = v => Math.round(v);

/* Local (America/Denver) date as YYYY-MM-DD — fixes the UTC-midnight bug */
function localToday() {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Denver', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date());
  const p = {}; parts.forEach(x => p[x.type] = x.value);
  return `${p.year}-${p.month}-${p.day}`;
}
function shiftDate(iso, days) {
  const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function niceDay(iso, today) {
  const d = new Date(iso + 'T12:00:00');
  const dow = d.toLocaleDateString('en-US', { weekday: 'short' });
  const md = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  if (iso === today) return ['Today', md];
  if (iso === shiftDate(today, 1)) return ['Tomorrow', md];
  return [dow, md];
}

/* ============================ DATA FETCH ============================ */
async function fetchForecast(resort) {
  const params = new URLSearchParams({
    latitude: resort.lat, longitude: resort.lon,
    current: 'temperature_2m,snowfall,wind_speed_10m,weather_code',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,snowfall_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max',
    temperature_unit: 'fahrenheit', wind_speed_unit: 'mph',
    past_days: HIST_DAYS, forecast_days: FC_DAYS, timezone: 'America/Denver',
  });
  const r = await fetch('https://api.open-meteo.com/v1/forecast?' + params);
  if (!r.ok) throw new Error('forecast http ' + r.status);
  return r.json();
}

/* Real observed snow depth (inches) from NRCS SNOTEL */
async function fetchSnotel(resort, beginDate, endDate) {
  const params = new URLSearchParams({
    stationTriplets: resort.snotel, elements: 'SNWD', duration: 'daily',
    beginDate, endDate,
  });
  const r = await fetch('https://wcc.sc.egov.usda.gov/awdbRestApi/services/v1/data?' + params);
  if (!r.ok) throw new Error('snotel http ' + r.status);
  return r.json();
}

function cmToIn(cm) { return cm / 2.54; }  // snowfall_sum is already SNOW depth in cm — no SLR multiply

/* ============================ PROCESS ============================ */
function process(resort, fc, sn) {
  const today = localToday();
  const daily = fc.daily;
  const days = daily.time.map((date, i) => ({
    date,
    code: daily.weather_code[i],
    tmax: daily.temperature_2m_max[i],
    tmin: daily.temperature_2m_min[i],
    snowIn: cmToIn(daily.snowfall_sum[i] || 0),   // corrected: no ratio multiply
    pop: daily.precipitation_probability_max[i],
    wind: daily.wind_speed_10m_max[i],
    gust: daily.wind_gusts_10m_max[i],
  }));

  const hist = days.filter(d => d.date < today);
  const future = days.filter(d => d.date >= today);

  /* Observed new snow = day-over-day increase in SNOTEL snow depth (floor 0) */
  let obs = [], depthNow = null, obsSource = null;
  try {
    const vals = sn && sn[0] && sn[0].data && sn[0].data[0] && sn[0].data[0].values ? sn[0].data[0].values : [];
    const el = sn && sn[0] && sn[0].data && sn[0].data[0] ? sn[0].data[0].stationElement : null;
    obsSource = el ? 'SNOTEL' : null;
    let prev = null;
    for (const v of vals) {
      const depth = (v.value == null) ? null : Number(v.value);
      if (depth != null && prev != null) {
        obs.push({ date: v.date, newIn: Math.max(0, depth - prev) });
      }
      if (depth != null) { prev = depth; depthNow = depth; }
    }
  } catch (e) { obs = []; }

  const obsTotal = r1(obs.reduce((s, o) => s + o.newIn, 0));
  const fc72 = r1(future.slice(0, 3).reduce((s, d) => s + d.snowIn, 0));
  const fc7d = r1(future.slice(0, 7).reduce((s, d) => s + d.snowIn, 0));

  return { today, days, hist, future, obs, obsTotal, fc72, fc7d, depthNow, obsSource,
           current: fc.current, currentUnits: fc.current_units };
}

/* ============================ MAP ============================ */
function initMap() {
  state.map = L.map('map', { zoomControl: true, attributionControl: true }).setView([39.25, -106.0], 8);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap &copy; CARTO',
  }).addTo(state.map);

  RESORTS.forEach(res => {
    const m = L.marker([res.lat, res.lon], {
      icon: L.divIcon({ className: '', html: `<div class="resort-marker" data-r="${res.name}"><span class="val">—</span></div>`, iconSize: null }),
      title: res.name,
    }).addTo(state.map);
    m.on('click', () => selectResort(res, true));
    state.markers[res.name] = m;
  });

  $('radarBtn').addEventListener('click', toggleRadar);
}

function updateMarker(res, d) {
  const el = state.markers[res.name] && state.markers[res.name].getElement();
  if (!el) return;
  const mk = el.querySelector('.resort-marker');
  const v = d ? d.fc72 : null;
  const label = (v != null && v >= 0.1) ? v + '"' : '—';
  mk.querySelector('.val').textContent = label;
  mk.classList.toggle('big', v != null && v >= 6);
  mk.classList.toggle('selected', state.selected === res.name);
}

function toggleRadar() {
  state.radarOn = !state.radarOn;
  const btn = $('radarBtn');
  btn.classList.toggle('on', state.radarOn);
  if (state.radarOn) {
    state.radar = L.tileLayer('https://tilecache.rainviewer.com/v2/radar/nowcast_0/256/{z}/{x}/{y}/2/1_1.png', { opacity: 0.6, attribution: 'RainViewer' }).addTo(state.map);
  } else if (state.radar) {
    state.map.removeLayer(state.radar); state.radar = null;
  }
}

/* ============================ RENDER ============================ */
function confidence(dayIndex, pop) {
  // confidence decays with lead time, nudged by precip probability
  const base = Math.max(0.25, 1 - dayIndex * 0.075);
  const adj = pop != null ? (pop / 100) * 0.2 : 0;
  const c = Math.min(0.98, base + adj);
  const label = c > 0.75 ? 'High' : c > 0.5 ? 'Medium' : 'Low';
  const color = c > 0.75 ? 'var(--good)' : c > 0.5 ? 'var(--accent)' : 'var(--warn)';
  return { pct: Math.round(c * 100), label, color };
}

function renderPanel(res, d) {
  const cur = d.current || {};
  const curT = cur.temperature_2m != null ? r0(cur.temperature_2m) + '°' : '—';
  const depth = d.depthNow != null ? r0(d.depthNow) + '"' : '—';

  let html = `
    <div class="panel-head">
      <div>
        <h2>${res.name}</h2>
        <div class="region">${res.region} Colorado</div>
        <div class="elev">Summit <b>${res.elev.toLocaleString()} ft</b></div>
      </div>
      <div style="text-align:right">
        <div style="font-size:26px;font-weight:800;line-height:1">${curT}</div>
        <div style="font-size:10.5px;color:var(--muted);margin-top:2px">current</div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat">
        <div class="label">Past 7 days <span class="obs-tag">OBS</span></div>
        <div class="val">${d.obsTotal}<small>"</small></div>
        <div class="sub">SNOTEL new snow</div>
      </div>
      <div class="stat">
        <div class="label">Snow depth <span class="obs-tag">OBS</span></div>
        <div class="val">${depth.replace('"','')}<small>"</small></div>
        <div class="sub">on the ground</div>
      </div>
      <div class="stat accent">
        <div class="label">Next 72 hrs <span class="fc-tag">FCST</span></div>
        <div class="val">${d.fc72}<small>"</small></div>
        <div class="sub">expected new snow</div>
      </div>
      <div class="stat">
        <div class="label">Next 7 days <span class="fc-tag">FCST</span></div>
        <div class="val">${d.fc7d}<small>"</small></div>
        <div class="sub">expected new snow</div>
      </div>
    </div>

    <div class="sec-title">14-day snowfall</div>
    <div class="chart-wrap">
      ${renderChart(d)}
      <div class="chart-legend">
        <div class="k"><span class="sw" style="background:#3ddc97"></span>Observed (SNOTEL)</div>
        <div class="k"><span class="sw" style="background:#4cc2ff"></span>Forecast</div>
      </div>
    </div>

    <div class="sec-title">Daily forecast</div>
    ${d.future.slice(0, 7).map((day, i) => renderDayCard(day, d.today, i)).join('')}

    <div class="sec-title">All days</div>
    <div class="chart-wrap" style="padding:6px 8px">
      <table>
        <thead><tr><th>Day</th><th>High</th><th>Low</th><th>Snow</th><th>POP</th></tr></thead>
        <tbody>
          ${d.future.map((day) => {
            const [dw, md] = niceDay(day.date, d.today);
            const s = day.snowIn >= 0.1 ? r1(day.snowIn) + '"' : '—';
            return `<tr><td>${dw} <span style="color:var(--dim);font-size:10px">${md}</span></td><td class="t">${r0(day.tmax)}°</td><td style="color:var(--muted)">${r0(day.tmin)}°</td><td class="s">${s}</td><td style="color:var(--muted)">${day.pop != null ? day.pop + '%' : '—'}</td></tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <div class="src-note">
      <b>Observed:</b> NRCS SNOTEL station ${res.snotel.split(':')[0]} (daily snow depth, new snow = depth increase).<br>
      <b>Forecast:</b> Open-Meteo model blend at a point near the resort; point elevation may differ from summit. Updated just now.
    </div>
  `;
  $('panelContent').innerHTML = html;
}

function renderDayCard(day, today, idx) {
  const [dw, md] = niceDay(day.date, today);
  const s = day.snowIn >= 0.1 ? r1(day.snowIn) : null;
  const c = confidence(idx, day.pop);
  const windHold = day.gust != null && day.gust >= 40;
  return `
    <div class="day-card">
      <div class="day-top">
        <div style="display:flex;align-items:center;gap:9px">
          ${wxIcon(day.code)}
          <div class="d">${dw}<small>${md}</small></div>
        </div>
        <div class="snow-pill ${s ? '' : 'none'}">${s ? s + '"' : '—'}</div>
      </div>
      <div class="day-meta">
        <span>High <b>${r0(day.tmax)}°</b></span>
        <span>Low <b>${r0(day.tmin)}°</b></span>
        <span>POP <b>${day.pop != null ? day.pop + '%' : '—'}</b></span>
        <span style="display:flex;align-items:center;gap:4px">${IC.wind}<b>${r0(day.wind)} mph</b></span>
      </div>
      ${windHold ? `<div class="wind-flag">${IC.alert} Lift-hold risk — gusts to ${r0(day.gust)} mph</div>` : ''}
      <div class="conf">
        <div class="bar"><i style="width:${c.pct}%;background:${c.color}"></i></div>
        <span style="color:${c.color}">${c.label}</span>
      </div>
    </div>`;
}

function renderChart(d) {
  const W = 320, H = 190, padL = 30, padB = 26, padT = 14, padR = 8;
  const obsByDate = {}; d.obs.forEach(o => obsByDate[o.date] = o.newIn);
  const all = d.days.map(day => ({
    date: day.date,
    obs: obsByDate[day.date] != null ? obsByDate[day.date] : null,
    fc: day.date >= d.today ? day.snowIn : null,
  }));
  const maxV = Math.max(1, ...all.map(a => Math.max(a.obs || 0, a.fc || 0)));
  const n = all.length;
  const iw = W - padL - padR, ih = H - padT - padB;
  const x = i => padL + (i + 0.5) * (iw / n);
  const y = v => padT + ih - (v / maxV) * ih;
  const bw = Math.max(4, (iw / n) * 0.6);

  let bars = '', labels = '', grid = '';
  for (let g = 0; g <= 4; g++) {
    const gv = (maxV / 4) * g;
    grid += `<line x1="${padL}" y1="${y(gv)}" x2="${W - padR}" y2="${y(gv)}" stroke="#232a36" stroke-width="1"/>` +
            `<text x="${padL - 6}" y="${y(gv) + 3}" fill="#5c6774" font-size="9" text-anchor="end">${r1(gv)}</text>`;
  }
  all.forEach((a, i) => {
    const date = new Date(a.date + 'T12:00:00');
    if (i % Math.ceil(n / 7) === 0) {
      labels += `<text x="${x(i)}" y="${H - 8}" fill="#5c6774" font-size="9" text-anchor="middle">${date.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' })}</text>`;
    }
    if (a.obs != null && a.obs >= 0.05) {
      const h = (a.obs / maxV) * ih;
      bars += `<rect x="${x(i) - bw / 2}" y="${y(a.obs)}" width="${bw}" height="${Math.max(1.5, h)}" rx="2" fill="#3ddc97"/>`;
    }
    if (a.fc != null && a.fc >= 0.05) {
      const h = (a.fc / maxV) * ih;
      bars += `<rect x="${x(i) - bw / 2}" y="${y(a.fc)}" width="${bw}" height="${Math.max(1.5, h)}" rx="2" fill="#4cc2ff"/>`;
    }
  });
  // "today" divider
  const ti = all.findIndex(a => a.date === d.today);
  if (ti >= 0) {
    grid += `<line x1="${x(ti)}" y1="${padT}" x2="${x(ti)}" y2="${H - padB}" stroke="#2c3542" stroke-dasharray="3 3"/>`;
  }
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${grid}${bars}${labels}</svg>`;
}

function skeleton() {
  $('panelContent').innerHTML = `
    <div class="skel" style="height:70px;margin-bottom:16px"></div>
    <div class="stat-grid">${'<div class="skel" style="height:74px"></div>'.repeat(4)}</div>
    <div class="skel" style="height:220px;margin:18px 0"></div>
    ${'<div class="skel" style="height:86px;margin-bottom:8px"></div>'.repeat(4)}`;
}

/* ============================ ORCHESTRATION ============================ */
async function loadResort(res) {
  const end = localToday();
  const begin = shiftDate(end, -(HIST_DAYS + 1));
  const [fc, sn] = await Promise.all([
    fetchForecast(res),
    fetchSnotel(res, begin, end).catch(() => null),
  ]);
  const d = process(res, fc, sn);
  state.data[res.name] = d;
  updateMarker(res, d);
  return d;
}

async function selectResort(res, fromMap) {
  state.selected = res.name;
  Object.values(state.markers).forEach(m => {
    const el = m.getElement(); if (el) el.querySelector('.resort-marker').classList.remove('selected');
  });
  skeleton();
  try {
    const d = await loadResort(res);
    renderPanel(res, d);
    updateMarker(res, d);
    if (fromMap) state.map.panTo([res.lat, res.lon], { animate: true });
    const mk = state.markers[res.name];
    mk.bindPopup(`<b>${res.name}</b><br>72-hr forecast: <b>${d.fc72}"</b><br>7-day observed: <b>${d.obsTotal}"</b>`).openPopup();
  } catch (e) {
    $('panelContent').innerHTML = `<div style="padding:20px;color:var(--bad);font-size:13px">Failed to load data for ${res.name}.<br><span style="color:var(--muted);font-size:11px">${e.message}</span></div>`;
  }
}

async function refreshAll() {
  await Promise.all(RESORTS.map(r => loadResort(r).catch(() => null)));
  if (state.selected) {
    const res = RESORTS.find(r => r.name === state.selected);
    if (res && state.data[res.name]) renderPanel(res, state.data[res.name]);
  }
  const now = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Denver' });
  $('clock').textContent = 'Updated ' + now;
}

function startClock() {
  const tick = () => {
    $('clock').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', timeZone: 'America/Denver' }) + ' MT';
  };
  tick(); setInterval(tick, 1000);
}

/* ============================ INIT ============================ */
function init() {
  initMap();
  startClock();
  refreshAll();
  selectResort(RESORTS[0], false);
  setInterval(refreshAll, REFRESH_MS);
}
init();
</script>
